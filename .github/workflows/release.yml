# Builds Heavenfall Beta for Windows (HeavenfallBeta-windows.zip) and the 3DS launcher (HeavenfallBeta-3ds.cia and .3dsx, with the console patch sets) and attaches them to the GitHub release of the tag.
# Push a tag to release (docs/develop/development.md, "Publishing a release"):  git tag v0.2.0 && git push origin v0.2.0
# Run by hand (Actions > Release > Run workflow) to only build: the zip is then an artifact of the run.
# The builds run with a read-only token that is not kept on disk; only the job `attach`, which runs no package or build
# tool, can write the release, and it does so only after both builds succeeded.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"      # the version the pinned packages were tested on
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: A tag must be the program's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c "import os, sys; from core import __version__ as v; t = os.environ['GITHUB_REF_NAME'].lstrip('v'); sys.exit(0 if t == v else f'tag {t} is not the program version {v}')"

      - name: Install the packages
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Lint
        run: python -m ruff check .

      - name: Build HeavenfallBeta-windows.zip
        run: python tools/release/build_exe.py --work work/exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: HeavenfallBeta-windows
          path: work/exe/dist/HeavenfallBeta-windows.zip
          if-no-files-found: error

  console:
    # The 3DS launcher: built in devkitPro's devkitARM container, with every console patch set of console/ (with and without MH XX) beside it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:20260610@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: A tag must be the program's version, and every patch set the tag
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' core/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME#v} is not the program version $version"; exit 1
          fi
          sets=$(ls console/*.hfpatch 2>/dev/null || true)
          [ -n "$sets" ] || { echo "no patch set in console/"; exit 1; }
          for set in $sets; do
            made=$(dd if="$set" bs=1 skip=80 count=16 2>/dev/null | tr -d '\0')
            [ "$made" = "$version" ] || { echo "$set is version $made, the tag's is $version"; exit 1; }
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Tools (portlibs, makerom and bannertool at pinned versions)
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip python3
          dkp-pacman -S --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib
          mkdir -p "$HOME/bin" /tmp/tools
          cd /tmp/tools
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          echo "287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e  makerom.zip" | sha256sum -c -
          unzip -o makerom.zip makerom -d "$HOME/bin"
          curl -fsSL -o bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          echo "748519d200519db18e9fd00c332ac32f5411e41230258291e89953a76c1f7155  bannertool.tar.gz" | sha256sum -c -
          tar xzf bannertool.tar.gz --strip-components=1 -C "$HOME/bin" bannertool-1.2.3-linux/bannertool
          chmod +x "$HOME/bin/makerom" "$HOME/bin/bannertool"

      - name: Build the launcher (.cia and .3dsx)
        shell: bash
        run: |
          export PATH="$HOME/bin:$PATH"
          make -C tools/build/installer_3ds VERSION="$VERSION"
          make -C tools/build/installer_3ds VERSION="$VERSION" PYTHON=python3 cia   # cia_version.py: the release's version in the CIA
          mkdir -p dist
          cp tools/build/installer_3ds/heavenfall_launcher.cia dist/HeavenfallBeta-3ds.cia
          cp tools/build/installer_3ds/heavenfall_launcher.3dsx dist/HeavenfallBeta-3ds.3dsx
          cp console/*.hfpatch dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: HeavenfallBeta-3ds
          path: dist/*
          if-no-files-found: error

  attach:
    needs: [windows, console]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # to create the release and upload the zip, the launcher and the patch sets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1     (the changelog's section is the release's text)
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: HeavenfallBeta-windows
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: HeavenfallBeta-3ds
          path: dist

      - name: Attach HeavenfallBeta-windows.zip, the launcher and the patch sets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || { python3 tools/release/changelog_section.py CHANGELOG.md "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md" \
                 && gh release create "$GITHUB_REF_NAME" --verify-tag --title "Heavenfall Single-Screen Mod $GITHUB_REF_NAME" \
                      --notes-file "$RUNNER_TEMP/notes.md"; }
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
