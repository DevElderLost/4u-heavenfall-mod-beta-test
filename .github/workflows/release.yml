# Builds Heavenfall Beta for Windows (HeavenfallBeta-windows.zip) and the 3DS launcher (HeavenfallBeta-3ds.cia and .3dsx, with the console patch sets and their shared file), checks the patch sets for Heavenfall for Android, and attaches them all to the GitHub release of the tag.
# Push a tag to release (docs/develop/development.md, "Publishing a release"):  git tag v0.2.0 && git push origin v0.2.0
# Run by hand (Actions > Release > Run workflow) to only build: the zip is then an artifact of the run.
# The builds run with a read-only token that is not kept on disk; only the job `attach`, which runs no package or build
# tool, can write the release, and it does so only after both builds succeeded.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"      # the version the pinned packages were tested on
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: A tag must be the program's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c "import os, sys; from core import __version__ as v; t = os.environ['GITHUB_REF_NAME'].lstrip('v'); sys.exit(0 if t == v else f'tag {t} is not the program version {v}')"

      - name: Install the packages
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Lint
        run: python -m ruff check .

      - name: Build HeavenfallBeta-windows.zip
        run: python tools/release/build_exe.py --work work/exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: HeavenfallBeta-windows
          path: work/exe/dist/HeavenfallBeta-windows.zip
          if-no-files-found: error

  console:
    # The 3DS launcher: built in devkitPro's devkitARM container, with every console patch set of console/ (with and without MH XX) beside it.
    # The container is the last one with libctru 2.6: the launcher's AM calls are 2.6's, and 2.7 renamed them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:20251231@sha256:0e0a00e966f32121297ad8ebceabf5e9ca0a408f3c020fdf21384e03b499f3a0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: A tag must be the program's version, and every patch set the tag's, the edition's and what its name says
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' core/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME#v} is not the program version $version"; exit 1
          fi
          sets=$(ls console/*.hfpatch 2>/dev/null || true)
          [ -n "$sets" ] || { echo "no patch set in console/"; exit 1; }
          # the set's header (core/install/title/patchset.py, format 3): u32 format at 4, u32 region at 8, the edition
          # at 64 and the version at 80 (16 bytes each), MH XX's title at 128 (8 bytes, 0: none), the shared file's
          # SHA-256 at 176, the source stamp at 216 (32 bytes each), u32 flags at 248 (0: no set records a variant)
          u32() { od -An -tu4 -j "$2" -N4 "$1" | tr -d ' \n'; }
          hex() { od -An -tx1 -v -j "$2" -N "$3" "$1" | tr -d ' \n'; }
          stamp=""; shared=""
          for set in $sets; do
            made=$(dd if="$set" bs=1 skip=80 count=16 2>/dev/null | tr -d '\0')
            [ "$made" = "$version" ] || { echo "$set is version $made, the tag's is $version"; exit 1; }
            edition=$(dd if="$set" bs=1 skip=64 count=16 2>/dev/null | tr -d '\0')
            [ "$edition" = "HeavenfallBeta" ] || { echo "$set is of the edition $edition, not HeavenfallBeta"; exit 1; }
            [ "$(u32 "$set" 4)" = 3 ] || { echo "$set is format $(u32 "$set" 4), not a release's set (format 3)"; exit 1; }
            case "$(basename "$set")" in
              *-EUR.hfpatch|*-EUR-*) region=0 ;;
              *-USA.hfpatch|*-USA-*) region=1 ;;
              *) echo "$set names no region"; exit 1 ;;
            esac
            [ "$(u32 "$set" 8)" = "$region" ] || { echo "$set holds the set of the other region"; exit 1; }
            case "$(basename "$set")" in *-XX.hfpatch|*-XX-*) xx=yes ;; *) xx=no ;; esac
            [ "$(hex "$set" 128 8)" = 0000000000000000 ] && has=no || has=yes
            [ "$has" = "$xx" ] || { echo "$set: its name and its header differ on MH XX"; exit 1; }
            [ "$(u32 "$set" 248)" = 0 ] || { echo "$set: its header has flags, a set of a release has none"; exit 1; }
            this=$(hex "$set" 216 32)
            [ -z "$stamp" ] || [ "$this" = "$stamp" ] || { echo "$set was made from other code than the other sets"; exit 1; }
            stamp=$this
            this=$(hex "$set" 176 32)
            if [ "$this" != "$(printf '0%.0s' $(seq 64))" ]; then
              [ -z "$shared" ] || [ "$this" = "$shared" ] || { echo "$set reads another shared file than the other sets"; exit 1; }
              shared=$this
            fi
          done
          for name in HeavenfallBeta-3ds-EUR HeavenfallBeta-3ds-USA HeavenfallBeta-3ds-EUR-XX HeavenfallBeta-3ds-USA-XX; do
            [ -f "console/$name.hfpatch" ] || { echo "console/$name.hfpatch is missing: all four sets are needed"; exit 1; }
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Portlibs, and libctru 2.6 (the AM calls the launcher makes)
        shell: bash
        run: |
          dkp-pacman -Sy --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib
          dkp-pacman -Q libctru | grep -q ' 2\.6\.' || { echo "the launcher needs libctru 2.6:"; dkp-pacman -Q libctru; exit 1; }

      - name: Build the launcher (the .3dsx, and the .elf and romfs the CIA is packed from)
        shell: bash
        run: make -C tools/build/installer_3ds VERSION="$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: launcher-build
          path: |
            tools/build/installer_3ds/heavenfall_launcher.elf
            tools/build/installer_3ds/heavenfall_launcher.3dsx
            tools/build/installer_3ds/romfs/gfx/
          if-no-files-found: error

  cia:
    # The launcher's CIA, packed from the container's build on the runner: makerom and bannertool need glibc 2.38, newer
    # than the container's.
    needs: console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: launcher-build
          path: tools/build/installer_3ds

      - name: Tools (makerom and bannertool at pinned versions)
        shell: bash
        run: |
          mkdir -p "$HOME/bin" /tmp/tools
          cd /tmp/tools
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          echo "287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e  makerom.zip" | sha256sum -c -
          unzip -o makerom.zip makerom -d "$HOME/bin"
          curl -fsSL -o bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          echo "748519d200519db18e9fd00c332ac32f5411e41230258291e89953a76c1f7155  bannertool.tar.gz" | sha256sum -c -
          tar xzf bannertool.tar.gz --strip-components=1 -C "$HOME/bin" bannertool-1.2.3-linux/bannertool
          chmod +x "$HOME/bin/makerom" "$HOME/bin/bannertool"

      - name: Pack the launcher's CIA (.cia and .3dsx, with the patch sets and their shared file)
        shell: bash
        run: |
          export PATH="$HOME/bin:$PATH"
          version=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' core/__init__.py)
          make -C tools/build/installer_3ds VERSION="$version" PYTHON=python3 cia-pack   # cia_version.py: the release's version in the CIA
          mkdir -p dist
          cp tools/build/installer_3ds/heavenfall_launcher.cia dist/HeavenfallBeta-3ds.cia
          cp tools/build/installer_3ds/heavenfall_launcher.3dsx dist/HeavenfallBeta-3ds.3dsx
          cp console/*.hfpatch dist/
          # the shared file every set copies files from, made from this checkout's files; every set checked against it
          # and against this checkout's core/ files (its source stamp)
          python3 tools/release/console_sets.py --sets console --version "$version" \
            --shared-out dist/HeavenfallBeta-3ds-shared.hfpack
          # the release's own copy of its API answer: the launcher reads it when the API refuses (its hourly limit per address)
          python3 tools/release/console_release_file.py --repo "$GITHUB_REPOSITORY" --tag "v$version" \
            --changelog CHANGELOG.md --out dist/HeavenfallBeta-3ds-release.json dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: HeavenfallBeta-3ds
          path: dist/*
          if-no-files-found: error

  android:
    # The patch sets for Heavenfall for Android (format 4, android/*.hfpatch) and the release's own copy of its API answer
    # that lists them with the shared file. The sets are made on a PC (they need the player's game); here they are only
    # checked against this checkout and packed.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: A tag must be the program's version, and every Android set the tag's, the edition's, the update's and what its name says
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' core/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME#v} is not the program version $version"; exit 1
          fi
          [ -n "$(ls android/*.hfpatch 2>/dev/null)" ] || { echo "no patch set in android/"; exit 1; }
          # a console set (format 3) among them is refused here, as an Android set (format 4) in the console folder is refused by
          # the console job: the header is read by tools/release/console_sets.py --kind android
          mkdir -p "$RUNNER_TEMP/shared" dist
          python3 tools/release/console_sets.py --kind android --sets android --version "$version" \
            --shared-out "$RUNNER_TEMP/shared/HeavenfallBeta-3ds-shared.hfpack"
          cp android/*.hfpatch dist/
          # the release's own copy of its API answer: the app reads it when the API refuses (its hourly limit per
          # address); it lists the shared file, which the console job's artifact carries (the same bytes)
          python3 tools/release/console_release_file.py --repo "$GITHUB_REPOSITORY" --tag "v$version" \
            --changelog CHANGELOG.md --out dist/HeavenfallBeta-android-release.json dist/*.hfpatch \
            "$RUNNER_TEMP/shared/HeavenfallBeta-3ds-shared.hfpack"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: HeavenfallBeta-android
          path: dist/*
          if-no-files-found: error

  attach:
    needs: [windows, cia, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # to create the release and upload the zip, the launcher and the patch sets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1     (the changelog's section is the release's text)
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: HeavenfallBeta-windows
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: HeavenfallBeta-3ds
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: HeavenfallBeta-android
          path: dist

      - name: Attach HeavenfallBeta-windows.zip, the launcher and the patch sets (the 3DS's and Android's) to the release
        # The release is made as a draft and published only once every file is attached: until then releases/latest is
        # the previous release, whole, for the program and the 3DS launcher.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            [ "$draft" = "true" ] || { echo "$GITHUB_REF_NAME is already published: to attach again, turn it back into a draft first"; exit 1; }
          else
            python3 tools/release/changelog_section.py CHANGELOG.md "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Heavenfall Single-Screen Mod $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          for file in dist/*; do
            name=$(basename "$file")
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qxF "$name" \
              || { echo "$name is not attached: the release stays a draft"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
