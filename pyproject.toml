[project]
name = "heavenfall-beta"
version = "0.2.0"   # keep equal to core/__init__.py
description = "Heavenfall Beta: play Monster Hunter 4 Ultimate on one screen in an emulator"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["PySide6>=6.6", "numpy>=1.24", "zstandard>=0.22"]  # numpy: the interface tools; zstandard: .zcci/.zcia

[project.optional-dependencies]
dev = ["ruff>=0.6"]
# The Windows program (tools/release/build_exe.py); its exact pins are in requirements-build.txt, which the release uses
build = ["pyinstaller>=6.22"]

[project.scripts]
heavenfall-beta = "core.gui.__main__:main"    # the app (needs PySide6)
heavenfall-beta-cli = "core.app.cli:main"    # the command line, as `python -m core`

[tool.setuptools.packages.find]
include = ["core*"]       # the other folders (docs, tools) are not the package

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["output", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]  # zip() without strict=: it would make every call raise on unequal lengths or add noise
